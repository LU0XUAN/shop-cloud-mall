spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/shop-cloud?serverTimezone=GMT%2B8&userUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath:mapper/*.xml
logging:
  level:
    root: info
    com.shop.logs.mapper: debug
file:
  mac:
    path: ~/file/
    avatar: ~/avatar/
  linux:
    path: /home/your_username/file/
    avatar: /home/your_username/avatar/
  windows:
    path: D:/your_username/file/
    avatar: D:/your_username/avatar/
maxSize: 100
avatarMaxSize: 5
